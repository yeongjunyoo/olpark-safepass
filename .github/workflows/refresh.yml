name: Olpark SafePass 2028 Zero-Cost Data Refresh & GitHub Pages Deploy

on:
  schedule:
    # 06:00, 12:00, 18:00, 00:00 KST (UTC 21:00, 03:00, 09:00, 15:00)
    - cron: '0 21,3,9,15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/refresh_live_data.py'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Minimal Python Dependencies
        run: python3 -m pip install --no-cache-dir pandas

      - name: Refresh Live Public Data Snapshot (with Graceful Fallback)
        env:
          KSPONCO_PARKING_KEY: ${{ secrets.KSPONCO_PARKING_KEY }}
          SEOUL_OPENDATA_KEY: ${{ secrets.SEOUL_OPENDATA_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
        run: |
          python3 scripts/refresh_live_data.py

      - name: Commit Updated Snapshot (if changed on schedule/dispatch)
        if: github.event_name != 'push'
        run: |
          git config user.name "olpark-safepass-bot"
          git config user.email "bot@olpark-safepass.local"
          git add web/public/data/live_snapshot.json web/public/data/concerts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): scheduled live public-data refresh"
            git push
          else
            echo "No snapshot changes to commit."
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build Production Web App
        working-directory: web
        env:
          NODE_OPTIONS: '--max-old-space-size=1536'
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          touch dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
